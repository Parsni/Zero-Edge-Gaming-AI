<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc"><title id="title">Traceframe evidence pipeline</title><desc id="desc">Edge capture sends a signed clip manifest to a local motion-framing and media-processing service, which issues an MP4 receipt for audit. Cloud storage and a future transparency ledger are optional or proposed.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#c6f36b"/><stop offset="1" stop-color="#57d9c3"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a9bc94"/></marker></defs><rect width="1200" height="480" rx="24" fill="#121712"/><text x="54" y="61" fill="#c6f36b" font-family="monospace" font-size="15" letter-spacing="3">EDGE → CLOUD → AUDIT · PROTOTYPE DATA FLOW</text><g font-family="Arial,sans-serif"><rect x="55" y="125" width="300" height="230" rx="14" fill="#1d261d" stroke="#566747"/><text x="82" y="165" fill="#c6f36b" font-size="14">01 / EDGE CAPTURE</text><text x="82" y="213" fill="#f2f4ee" font-size="24" font-weight="700">Capture a moment</text><text x="82" y="249" fill="#aab4a2" font-size="15">Screen stream + browser timing</text><text x="82" y="276" fill="#aab4a2" font-size="15">Chunk hashes + ephemeral signature</text><text x="82" y="324" fill="#d0d6c8" font-family="monospace" font-size="12">CLIENT KEY · NOT DEVICE ENROLLED</text><rect x="450" y="125" width="300" height="230" rx="14" fill="#1b2526" stroke="#496a63"/><text x="477" y="165" fill="#80e5cb" font-size="14">02 / LOCAL MOTION + FFMPEG</text><text x="477" y="213" fill="#f2f4ee" font-size="24" font-weight="700">Frame the highlight</text><text x="477" y="249" fill="#aab4a2" font-size="15">Local motion heuristic (default)</text><text x="477" y="276" fill="#aab4a2" font-size="15">FFmpeg portrait transcode</text><text x="477" y="324" fill="#d0d6c8" font-family="monospace" font-size="12">OFFLINE DEFAULT · AWS OPTIONAL</text><rect x="845" y="125" width="300" height="230" rx="14" fill="#25251b" stroke="#746c46"/><text x="872" y="165" fill="#e8d782" font-size="14">03 / AUDIT + DISTRIBUTION</text><text x="872" y="213" fill="#f2f4ee" font-size="24" font-weight="700">Verify the receipt</text><text x="872" y="249" fill="#aab4a2" font-size="15">Signed MP4 + companion JSON</text><text x="872" y="276" fill="#aab4a2" font-size="15">Byte changes rejected by verifier</text><text x="872" y="324" fill="#d0d6c8" font-family="monospace" font-size="12">ON-CHAIN LEDGER · PROPOSED</text><path d="M365 240H432" stroke="url(#g)" stroke-width="3" marker-end="url(#a)"/><path d="M760 240H827" stroke="url(#g)" stroke-width="3" marker-end="url(#a)"/><text x="55" y="415" fill="#8f9a88" font-family="monospace" font-size="13">DEMO LIMIT: synthetic source video and telemetry. Integrity check ≠ proof of human gameplay or device identity.</text></g></svg>